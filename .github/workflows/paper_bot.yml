name: MNQ Fractal Bot — Cloud Paper Runner

on:
  schedule:
    # Runs on schedule (e.g., every hour during active CME sessions)
    - cron: '0 * * * *'
  workflow_dispatch:
    # Allows manual one-click launch from GitHub Actions tab

jobs:
  run-paper-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Fetch Live Up-to-the-Minute MNQ Market Data
        run: |
          python -m mnq_fractal_bot.data.live_yahoo_fetcher

      - name: Execute Paper Simulation & Stream Live Alerts
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          # Check if running at End-of-Day (e.g. 21:00 UTC CME session close) or manual trigger
          SEND_SUMMARY_FLAG=""
          CURRENT_HOUR=$(date -u +%H)
          if [ "$CURRENT_HOUR" = "21" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SEND_SUMMARY_FLAG="--send-summary"
          fi

          python -m mnq_fractal_bot.execution.paper_stream_cli data/mnq_5m_live.csv \
            --min-stop-points 22 \
            --max-stop-points 35 \
            --exclude-hours-utc 3 4 9 \
            --max-hold-minutes 180 \
            --discord-webhook "${DISCORD_WEBHOOK:-https://discord.com/api/webhooks/1559122213980995637/VGqK-9RYzrw1vx1H-0pfblxzyGZKXEylBLID_rK_ZcF606gJCWAvBt4Y83ZAXWtqDQ6R}" \
            $SEND_SUMMARY_FLAG
